name: Build iOS No-Codesign

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Force Clean & Fetch
        run: |
          flutter clean
          flutter pub get

      - name: Build Fresh iOS Unsigned
        run: flutter build ios --no-codesign --release

      - name: Package Payload to .ipa
        run: |
          rm -rf Payload DocketFlow_fresh.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -9 DocketFlow_fresh.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocketFlow-iOS-Fresh
          path: DocketFlow_fresh.ipa
          retention-days: 1
