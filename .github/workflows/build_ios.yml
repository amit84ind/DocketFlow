name: Build iOS IPA (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git User
        run: |
          git config --global user.name "amit84ind"
          git config --global user.email "amit84ind@gmail.com"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Prepare iOS Config & Frameworks
        run: flutter build ios --config-only --no-codesign

      - name: Build Unsigned iOS App via xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -9 DocketFlow.ipa Payload

      - name: Upload .ipa Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DocketFlow-iOS-IPA
          path: DocketFlow.ipa
          retention-days: 14
